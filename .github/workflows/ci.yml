name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: |
          set +e
          npm test 2>&1 | tee testes.txt
          code=${PIPESTATUS[0]}
          body=$(grep -E "^# (tests|pass|fail)|^not ok" testes.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Testes (exit $code)::$body"
          exit $code
      - name: Build do site
        run: npm run build
  sources:
    # Confere ao vivo se as APIs reais ainda respondem no formato esperado (não bloqueia o deploy).
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar fontes ao vivo
        run: |
          set +e
          npm run verify:sources 2>&1 | tee fontes.txt
          code=${PIPESTATUS[0]}
          body=$(cat fontes.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=Fontes ao vivo (exit $code)::$body"
          exit $code
